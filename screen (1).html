<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبطال كالمي في الفضاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--a:#050314;--b:#1a0f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a:#03020f;--b:#150c3d}}
html,body{height:100%;margin:0;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse at 70% 30%,var(--b),var(--a) 70%);font-family:Cairo,Tahoma,sans-serif}
#st,svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.t{font-weight:900;fill:#fff;text-anchor:middle;filter:drop-shadow(0 2px 14px rgba(90,170,255,.35))}
.u{font-weight:700;fill:#fff;text-anchor:middle;filter:drop-shadow(0 1px 8px rgba(90,170,255,.3))}
.sway{animation:sway 32s ease-in-out infinite alternate}@keyframes sway{from{transform:translate(-14px,6px)}to{transform:translate(14px,-8px)}}
.bob{animation:bob ease-in-out infinite}@keyframes bob{0%,100%{transform:translate(0,0) rotate(1deg)}50%{transform:translate(4px,-9px) rotate(-1deg)}}
.legs{transform-box:fill-box;transform-origin:50% 0;animation:kick 2.6s ease-in-out infinite alternate}@keyframes kick{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl .3s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(.95,.85)}to{transform:scale(1.02,1.1)}}
.sp{animation:sp 2.4s ease-out infinite;opacity:0}@keyframes sp{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(-220px,var(--dy)) scale(1.1)}}
.sheen{animation:sheen 10s ease-in-out infinite}@keyframes sheen{0%,55%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(280px) skewX(-20deg)}}
.dr{animation:dr linear infinite}@keyframes dr{from{transform:translateX(calc(var(--w) + 200px))}to{transform:translateX(-400px)}}
.neb{animation:neb 28s ease-in-out infinite alternate}@keyframes neb{from{opacity:.5}to{opacity:1}}
.tw{animation:neb 6s ease-in-out infinite alternate}
.al{animation:alb 1.8s ease-in-out infinite alternate}@keyframes alb{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#stage{transition:opacity .9s}#bdg{transition:opacity .6s}#cnt{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.sway,.bob{animation-duration:30s}}
</style></head><body>

async function prep(m){const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=m.head}),c=document.createElement('canvas');c.width=m.w;c.height=m.h;const g=c.getContext('2d');g.drawImage(im,0,0,m.w,m.h);

const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('calmi-'+KEY,1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{autoIncrement:true});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});

const dbAdd=async m=>{const d=await idb();return new Promise(ok=>{const x=d.transaction('f','readwrite');x.objectStore('f').add(m);x.oncomplete=ok;x.onerror=ok})};
